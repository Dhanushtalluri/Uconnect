<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniTalk</title>

  <!-- Bootstrap / Bootstrap Icons / Inter Font -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  
  <!-- PrismJS for code highlight -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background-color: var(--bs-body-bg);
      transition: background 0.3s;
    }
    .chat-container {
      max-width: 480px;
      margin: 2rem auto;
      box-shadow: 0 0 32px #a78bfa33;
      border-radius: 1.5rem;
      background: var(--bs-body-bg);
      display: flex;
      flex-direction: column;
      height: 85vh;
      overflow: hidden;
    }
    .chat-header {
      border-bottom: 1px solid var(--bs-border-color);
      padding: 1rem 1.25rem;
      background: var(--bs-tertiary-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-logo {
      display: flex;
      align-items: center;
      gap: .7rem;
    }
    .chat-logo-icon {
      font-size: 2rem;
      color: #7950f2;
      margin-right: .5rem;
    }
    .chat-title {
      font-weight: 700;
      color: #6c4fff;
      font-size: 1.6rem;
    }
    .chat-actions {
      display: flex;
      align-items: center;
      gap: .7rem;
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem;
      background: var(--bs-body-bg);
      transition: background 0.3s;
      min-height: 0;
    }
    .chat-message {
      margin-bottom: 1rem;
      word-break: break-word;
      padding: .75rem 1rem;
      border-radius: 1rem;
      max-width: 80%;
      font-size: 1rem;
      line-height: 1.5;
    }
    .chat-message.user {
      margin-left: auto;
      background: #e0dcfb;
      color: #5f3dc4;
      text-align: right;
    }
    .chat-message.bot {
      margin-right: auto;
      background: #f5f7fa;
      color: #212529;
      text-align: left;
    }
    [data-bs-theme="dark"] .chat-message.bot {
      background: #29263a;
      color: #e5e7eb;
    }
    [data-bs-theme="dark"] .chat-message.user {
      background: #403189;
      color: #fff;
    }
    .typing-indicator span {
      display: inline-block;
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 50%;
      margin-right: 0.25rem;
      background: #a78bfa;
      animation: bounce 0.8s infinite alternate;
    }
    .typing-indicator span:nth-child(2) { animation-delay: .2s;}
    .typing-indicator span:nth-child(3) { animation-delay: .4s;}
    @keyframes bounce {to {transform: translateY(-9px);}}
    @media (max-width: 575px) {
      .chat-container { max-width: 100%; height: 98vh; margin: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="chat-container shadow">
    <!-- Header -->
    <div class="chat-header">
      <div class="chat-logo">
        <i class="bi bi-chat-square-heart chat-logo-icon"></i>
        <span class="chat-title">UniTalk</span>
      </div>
      <div class="chat-actions">
        <a href="student.html" class="btn btn-link btn-sm text-primary" title="Home">
          <i class="bi bi-house"></i>
        </a>
        <button onclick="clearChat()" class="btn btn-link btn-sm text-danger" title="Clear Chat">
          <i class="bi bi-trash3"></i>
        </button>
        <button class="btn btn-link btn-sm" id="themeToggle" title="Toggle Dark/Light">
          <i class="bi bi-moon-stars"></i>
        </button>
        <button class="btn btn-link btn-sm" id="voiceToggle" title="Voice Toggle">
          <i class="bi bi-mic-fill"></i>
        </button>
      </div>
    </div>
    <!-- Chat Messages -->
    <div id="chatBox" class="chat-box" role="log" aria-live="polite" aria-relevant="additions">
    </div>
    <!-- Chat Input -->
    <div class="d-flex align-items-center gap-2 p-3 border-top bg-body">
      <select id="modelSelect" class="form-select form-select-sm w-auto">
        <option value="mistralai/mistral-7b-instruct">Mistral 7B</option>
        <option value="openai/gpt-3.5-turbo">GPT-3.5 Turbo</option>
        <option value="deepseek-ai/deepseek-llm">DeepSeek coder (coming soon)</option>
      </select>
      <input type="text" id="userInput" placeholder="Type your question... (Enter to send)" class="form-control flex-fill" autocomplete="off" />
      <button id="voiceBtn" class="btn btn-outline-secondary"><i class="bi bi-mic"></i></button>
      <button onclick="sendMessage()" class="btn btn-primary"><i class="bi bi-send"></i></button>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script>
    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    const modelSelect = document.getElementById("modelSelect");
    let chatHistory = JSON.parse(localStorage.getItem("chatHistory")) || [];

    function saveToHistory(role, content) {
      chatHistory.push({ role, content });
      localStorage.setItem("chatHistory", JSON.stringify(chatHistory));
    }

    function loadChatHistory() {
      const saved = JSON.parse(localStorage.getItem("chatHistory")) || [];
      chatBox.innerHTML = "";
      saved.forEach(msg => {
        appendMessage(msg.role, msg.content);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(role, content) {
      const div = document.createElement("div");
      div.className = `chat-message ${role}`;
      if (/^<.+>$/.test(content)) {
        div.innerHTML = content;
      } else {
        div.textContent = content;
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      if(role==="bot") Prism.highlightAll();
    }

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const userText = input.value.trim();
      if (!userText) return;

      appendMessage("user", userText);
      saveToHistory("user", userText);

      // Typing Animation for bot
      const botMsg = document.createElement("div");
      botMsg.className = "chat-message bot typing-indicator";
      botMsg.innerHTML = `<span></span><span></span><span></span>`;
      chatBox.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      input.value = "";

      const nameMatch = userText.match(/my name is (\w+)/i);
      if (nameMatch) {
        const name = nameMatch[1];
        localStorage.setItem("userName", name);
        setTimeout(() => {
          botMsg.remove();
          appendMessage("bot", `Nice to meet you, ${name}!`);
          saveToHistory("bot", `Nice to meet you, ${name}!`);
        }, 500);
        return;
      }

      if (/what(?:'s| is) my name/i.test(userText)) {
        const savedName = localStorage.getItem("userName");
        setTimeout(() => {
          botMsg.remove();
          if (savedName) {
            appendMessage("bot", `Your name is ${savedName}.`);
            saveToHistory("bot", `Your name is ${savedName}.`);
          } else {
            appendMessage("bot", `I don’t know your name yet. You can tell me by saying "my name is ...".`);
            saveToHistory("bot", `I don’t know your name yet. You can tell me by saying "my name is ...".`);
          }
        }, 500);
        return;
      }

      const selectedModel = modelSelect.value;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: selectedModel,
            messages: [{ role: "user", content: userText }]
          })
        });

        const data = await response.json();
        setTimeout(() => botMsg.remove(), 500);
        if (data?.choices?.[0]?.message?.content) {
          const raw = data.choices[0].message.content;
          const html = marked.parse(raw);
          appendMessage("bot", DOMPurify.sanitize(html));
          Prism.highlightAll();
          speakText(raw);
          saveToHistory("bot", raw);
        } else {
          appendMessage("bot", "Sorry, I couldn’t understand that.");
          saveToHistory("bot", "Sorry, I couldn’t understand that.");
        }
      } catch (err) {
        botMsg.remove();
        appendMessage("bot", "Oops! There was an error connecting to the model.");
        saveToHistory("bot", "Oops! There was an error connecting to the model.");
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function toggleTheme() {
      const doc = document.documentElement;
      const actual = doc.getAttribute("data-bs-theme");
      doc.setAttribute("data-bs-theme", actual === "dark" ? "light" : "dark");
      document.getElementById("themeToggle").innerHTML = actual === "dark"
        ? '<i class="bi bi-moon-stars"></i>'
        : '<i class="bi bi-brightness-high"></i>';
    }

    function clearChat() {
      localStorage.removeItem("chatHistory");
      localStorage.removeItem("userName");
      chatHistory = [];
      chatBox.innerHTML = "";
      appendMessage("bot", "Hi! I’m UniTalk, your assistant from Universal College of Engineering and Technology. How can I help you today?");
      saveToHistory("bot", "Hi! I’m UniTalk, your assistant from Universal College of Engineering and Technology. How can I help you today?");
    }

    // Voice logic
    let recognition;
    let recognizing = false;
    let voiceEnabled = true;
    const voiceBtn = document.getElementById("voiceBtn");

    voiceBtn.onclick = function() {
      if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
        alert("Voice input is not supported.");
        return;
      }
      if (!recognizing) {
        recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        recognition.start();
        recognizing = true;
        voiceBtn.classList.add("active");

        recognition.onresult = function (event) {
          input.value = event.results[0][0].transcript;
          sendMessage();
        };

        recognition.onend = function () {
          recognizing = false;
          voiceBtn.classList.remove("active");
        };

        recognition.onerror = function (event) {
          recognizing = false;
          voiceBtn.classList.remove("active");
          alert("Voice input error: " + event.error);
        };
      } else {
        recognition.stop();
        recognizing = false;
        voiceBtn.classList.remove("active");
      }
    };

    function speakText(text) {
      const voiceToggle = document.getElementById("voiceToggle");
      if (!voiceToggle || !voiceEnabled) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 1;
      speechSynthesis.speak(utterance);
    }

    document.getElementById("voiceToggle").onclick = function() {
      voiceEnabled = !voiceEnabled;
      this.innerHTML = voiceEnabled
        ? '<i class="bi bi-mic-fill"></i>'
        : '<i class="bi bi-mic-mute-fill"></i>';
      if (!voiceEnabled) speechSynthesis.cancel();
    };

    document.getElementById("themeToggle").onclick = function(){
      toggleTheme();
    };

    window.addEventListener("DOMContentLoaded", () => {
      loadChatHistory();
      const name = localStorage.getItem("userName");
      if (name && chatHistory.length === 0) {
        appendMessage("bot", `Welcome back, ${name}! How can I help you today?`);
        saveToHistory("bot", `Welcome back, ${name}! How can I help you today?`);
      } else if (!chatHistory.length) {
        appendMessage("bot", `Hi! I’m your UniTalk. How can I help you today?`);
        saveToHistory("bot", `Hi! I’m your UniTalk. How can I help you today?`);
      }
    });
  </script>
</body>
</html>
